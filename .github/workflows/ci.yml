name: Tender Intelligence Agent CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/tender_test
      LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'mock_key_for_testing' }}
      LLM_MODEL: groq/openai/gpt-oss-120b
      LLM_FALLBACK_MODEL: groq/qwen/qwen3.6-27b
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || 'mock_key_for_testing' }}
      EMBEDDING_MODEL: jina-embeddings-v5-omni-small
      EMBEDDING_DIMENSION: "768"
      TIMEZONE: Asia/Kolkata
      FRONTEND_ORIGIN: http://localhost:5173
      INGESTION_ENABLED: "true"
      DISCOVERY_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install test-only dependencies
        run: pip install "sentence-transformers>=2.7.0"
        # sentence-transformers pulls torch (~1 GB) which exceeds Vercel's
        # serverless bundle limit (~250 MB). It is intentionally excluded from
        # requirements.txt so prod deployment stays within limits. Installing
        # it here gives CI the local embedding fallback without affecting prod.

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Lint with Ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ --ignore E501,F401,BLE001,B008,I001,F541

      - name: Run Pytest Test Suite
        working-directory: backend
        run: python -m pytest tests/ -o pythonpath=. -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
